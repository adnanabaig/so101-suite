version: 1
engine:
  # Shared by both engines. fixed_hz is the engine tick, and
  # max_velocity_deg_s is the commanded-reference slew limit (suite units per
  # second). Neither is a motor parameter. Geometry, limits and dynamics come
  # from the vendored MJCF in src/so101/simulation/assets/robotstudio_so101.
  fixed_hz: 60
  default_seed: 101
  initial_joint_positions:
    shoulder_pan: 0.0
    shoulder_lift: 0.0
    elbow_flex: 0.0
    wrist_flex: 0.0
    wrist_roll: 0.0
    gripper: 50.0
  max_velocity_deg_s:
    shoulder_pan: 90.0
    shoulder_lift: 90.0
    elbow_flex: 90.0
    wrist_flex: 120.0
    wrist_roll: 180.0
    gripper: 200.0
scenarios:
  - id: tabletop_pick
    label: Tabletop pick
    description: Single 40 mm cube in the central reachable workspace.
    surface:
      size_m: [0.8, 0.6, 0.04]
      height_m: 0.72
    randomization:
      object_position_jitter_m: [0.025, 0.025, 0.0]
      object_yaw_jitter_deg: 15.0
      object_scale_range: [0.9, 1.1]
    objects:
      - id: cube
        shape: box
        size_m: [0.04, 0.04, 0.04]
        pose: [0.22, 0.0, 0.02, 0.0, 0.0, 0.0]
        color: "#ffb84d"
        role: manipuland
  - id: bin_sort
    label: Two-bin sort
    description: Two distinct objects and target zones for repeatable evals.
    surface:
      size_m: [0.8, 0.6, 0.04]
      height_m: 0.72
    randomization:
      object_position_jitter_m: [0.02, 0.02, 0.0]
      object_yaw_jitter_deg: 20.0
      object_scale_range: [0.95, 1.05]
    objects:
      - id: blue_cube
        shape: box
        size_m: [0.035, 0.035, 0.035]
        pose: [0.20, -0.10, 0.0175, 0.0, 0.0, 0.0]
        color: "#38bdf8"
        role: manipuland
      - id: orange_cylinder
        shape: cylinder
        size_m: [0.025, 0.05]
        pose: [0.20, 0.10, 0.025, 0.0, 0.0, 0.0]
        color: "#fb923c"
        role: manipuland
      - id: left_target
        shape: box
        size_m: [0.12, 0.12, 0.008]
        pose: [0.32, -0.16, 0.004, 0.0, 0.0, 0.0]
        color: "#0c4a6e"
        role: target_zone
        randomize: false
      - id: right_target
        shape: box
        size_m: [0.12, 0.12, 0.008]
        pose: [0.32, 0.16, 0.004, 0.0, 0.0, 0.0]
        color: "#7c2d12"
        role: target_zone
        randomize: false
  - id: calibration_grid
    label: Calibration grid
    description: Uncluttered workspace for jog, limits, and tracking checks.
    surface:
      size_m: [0.8, 0.6, 0.04]
      height_m: 0.72
    randomization: {}
    objects: []
