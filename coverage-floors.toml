# Coverage floors, enforced by scripts/check_coverage.py (`make coverage`, the
# CI backend job and `make ci`).
#
# Metric: coverage.py `percent_covered` with branch coverage on, which is the
# "Cover" column of `coverage report`. Keys are repo-relative paths; function
# keys are "<path>::<qualified name>" as coverage.py names them.
#
# Each floor is the value measured at 7b59eda (5 identical runs) minus about
# 2 points, rounded down, so it tolerates small refactors without letting a
# change strip the tests from these paths. When coverage improves, raise the
# floor in the same change. Never lower one to land a change; add tests.
# A target missing from the report fails the check, so renames must move
# their floors along.

[settings]
branch = true

[files]
"src/so101/hardware/safety.py" = 85.0               # measured 87.56 (v0.2.1)
"src/so101/services/robot_manager.py" = 88.0        # measured 91.02 (v0.2.1)
"src/so101/services/routers/control.py" = 97.0      # measured 100.00 (v0.2.1)
# The standalone gate (latches and bus.lock for CLI commands), 1 run.
"src/so101/bringup/standalone.py" = 95.0            # measured 97.66
# Device-global physical ownership and append-only energized recovery. Initial
# fail-closed floor pending the first supported G15 coverage report.
"src/so101/bringup/ownership.py" = 70.0
# Cameras (RealSense stream), measured on the merged tree, 3 identical runs.
"src/so101/hardware/camera_spec.py" = 98.0          # measured 100.00
"src/so101/hardware/cameras.py" = 97.0              # measured 99.12
"src/so101/hardware/realsense.py" = 98.0            # measured 100.00
"src/so101/hardware/camera_discovery.py" = 95.0     # measured 97.56
